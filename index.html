<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Photo｜推しの年表アルバム</title>
<meta name="description" content="Timeline Photoは、推しの写真をグループもメンバーもひとつの年表に並べて残せる、iPhone向けのアルバムアプリです。">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#ffffff;--fg:#1d1b26;--sub:#6e687a;--line:#ece9f2;--btn:#1d1b26;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121117;--fg:#f4f2f8;--sub:#a49eb2;--line:#2a2733;--btn:#f4f2f8;--btnfg:#121117}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:64px 20px 48px;text-align:center}
.icon{width:120px;height:120px;border-radius:27px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
h1{margin:28px 0 4px;line-height:0}
.logo{width:260px;max-width:80%;height:auto}
.sub{color:var(--sub);margin:0 0 32px}
.lead{font-size:18px;margin:0 0 32px}
.btn{display:inline-block;background:var(--btn);color:var(--btnfg);text-decoration:none;padding:14px 28px;border-radius:999px;font-weight:600}
ul{list-style:none;padding:0;margin:40px 0;text-align:left;border-top:1px solid var(--line)}
li{padding:16px 4px;border-bottom:1px solid var(--line)}
li b{display:block}
li span{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:40px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<main>
<img class="icon" src="icon.png" alt="Timeline Photo のアイコン">
<h1><img class="logo" src="logo.png" alt="Timeline Photo"></h1>
<p class="sub">推しの年表アルバム</p>
<p class="lead">あの日のライブも、あの頃のビジュも。<br>バラバラだった推しの写真が、1本の年表でつながる。</p>
<a class="btn" href="https://apps.apple.com/jp/app/id6818167748">App Storeで見る</a>
<ul>
<li><b>グループもメンバーも、ひとつの年表に</b><span>グループ全体とメンバー個人のアルバムが、同じ時間の流れに並びます。</span></li>
<li><b>「何歳の時」「結成何年目」を自動で表示</b><span>写真の日付から、その時の年齢や活動年数が分かります。</span></li>
<li><b>年表を1枚の画像に</b><span>作った年表は画像として書き出して、SNSでシェアできます。</span></li>
<li><b>ページごとにロック</b><span>見せたくないページだけを、そっとロックできます。</span></li>
</ul>
<footer>
<a href="https://quixotic-virgo-3d6.notion.site/Timeline-Photo-3ef87ef451fa8065be67d31402eff980">プライバシーポリシー</a> ・

© 2026 Kosuke Takehara
</footer>
</main>
</body>
</html>
